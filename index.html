<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Far World — playable first-floor slice">
  <title>Far World — First Floor</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* Static start page: dark, no animation, no auto-play, no flashing. */
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0c0c0e;
      color: #e8e4d8;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 0.6rem;
      color: #f3efe4;
    }
    .lead {
      color: #c8c2b2;
      margin: 0 0 2rem;
    }
    ol {
      list-style: none;
      padding: 0;
      margin: 0 0 2.5rem;
    }
    li { margin: 0 0 0.9rem; }
    a.play {
      display: block;
      background: #1a1916;
      color: #f3efe4;
      text-decoration: none;
      border: 1px solid #5c5648;
      border-radius: 6px;
      padding: 0.95rem 1.15rem;
      font-size: 1.15rem;
    }
    a.play:hover,
    a.play:focus-visible {
      background: #24221c;
      border-color: #c4b48a;
      outline: 2px solid #c4b48a;
      outline-offset: 3px;
    }
    .n { color: #c4b48a; margin-right: 0.55rem; }
    .note {
      font-size: 0.95rem;
      color: #9a9588;
    }
    .note a { color: #c4b48a; }
  </style>
</head>
<body>
  <main>
    <h1>Far World</h1>
    <p class="lead">A playable first-floor slice. Open in Chrome or Firefox, then choose a room.</p>
    <ol>
      <li>
        <a class="play" href="first-floor/hallway.html"><span class="n">1.</span> Hallway</a>
      </li>
      <li>
        <a class="play" href="first-floor/teddy-room.html"><span class="n">2.</span> Teddy’s room</a>
      </li>
    </ol>
    <p class="note">The earlier hallway (v4.7) remains at <a href="v4.7/">/v4.7/</a>.</p>
  </main>
</body>
</html>
